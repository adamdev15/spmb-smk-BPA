services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: spmb-smk-bpadiwerna-app
    container_name: spmb_bpa_app
    restart: unless-stopped

    env_file:
      - .env

    environment:
      APP_NAME: "SPMB-SMK-Bhakti-Praja-Adiwerna"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: https://spmb.smkbpadiwerna.sch.id
      ASSET_URL: https://spmb.smkbpadiwerna.sch.id

      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: spmbadw
      DB_USERNAME: spmbadw
      DB_PASSWORD: Cthsmkbpadw#15

    expose:
      - "9000"
      
    depends_on:
      db:
        condition: service_started

    networks:
      - default


  db:
    image: mysql:8.0
    container_name: spmb_bpa_db
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: spmbadw
      MYSQL_USER: spmbadw
      MYSQL_PASSWORD: Cthsmkbpadw#15
      MYSQL_ROOT_PASSWORD: root_password

    volumes:
      - db_data:/var/lib/mysql

    networks:
      - default


  web:
    image: nginx:alpine
    container_name: spmb_bpa_web
    restart: unless-stopped

    depends_on:
      - app

    ports:
      - "8000:80"

    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf

    networks:
      - default


volumes:
  db_data:

networks:
  default:
    name: smk-bpadiwerna_default